help:
    secret_token_exposed:
        why: "API keys or access tokens were found in public JavaScript or HTML. Attackers can extract them to impersonate your accounts or incur unauthorized charges."
        fix: "Store API keys in server-side environment variables (.env) and immediately revoke compromised keys."
    insecure_form_action:
        why: "This form submits credentials or data to an unencrypted HTTP URL, vulnerable to network interception (Man-in-the-Middle)."
        fix: "Update the form action attribute to point strictly to an https:// URL."
    mixed_content:
        why: "The page is served over HTTPS but loads unencrypted HTTP scripts, styles, or iframes. An attacker on the network can alter these to inject arbitrary code."
        fix: "Update resource URLs to use https:// or protocol-relative paths."
    csp_missing:
        why: "Without a Content-Security-Policy, the browser cannot restrict untrusted script sources, significantly increasing the risk of XSS attacks."
        fix: "Add the Content-Security-Policy header in your web server configuration."
    hsts_missing:
        why: "Without HSTS, visitors might connect over plain HTTP on their first visit, allowing SSL stripping attacks."
        fix: "Add Strict-Transport-Security: max-age=31536000; includeSubDomains; preload."
    x_frame_missing:
        why: "The site can be framed inside a malicious third-party site to trick users into unwanted clicks (Clickjacking)."
        fix: "Add X-Frame-Options: SAMEORIGIN or use CSP frame-ancestors 'self'."
    cookie_no_secure:
        why: "Without the Secure flag, cookies can be transmitted over plain HTTP connections."
        fix: "Ensure all cookies set Secure; HttpOnly; SameSite=Lax."
    cookie_no_httponly:
        why: "Without HttpOnly, JavaScript can access session cookies (document.cookie), enabling session theft via XSS."
        fix: "Enable HttpOnly on all authentication and session cookies."
    cookie_samesite_missing:
        why: "SameSite controls whether cookies are sent with cross-site requests. Without it, the application is more susceptible to CSRF."
        fix: "Set SameSite=Lax or SameSite=Strict on all cookies."
    csp_unsafe_inline:
        why: "'unsafe-inline' allows execution of inline scripts and styles, undermining XSS mitigations."
        fix: "Move inline code to external bundles or use cryptographic nonces."
    csp_unsafe_eval:
        why: "'unsafe-eval' allows dynamic string execution via eval()."
        fix: "Eliminate dynamic eval() calls in your frontend scripts."
    csp_wildcard:
        why: "Wildcard sources (*) allow scripts to be loaded from any domain."
        fix: "Explicitly allow trusted domains instead of wildcards."
    nosniff_missing:
        why: "Without nosniff, browsers may attempt to guess file content types and execute script embedded in images or text."
        fix: "Add X-Content-Type-Options: nosniff header."
    tabnabbing:
        why: "Opening a target='_blank' link without rel='noopener noreferrer' grants the target page access to window.opener."
        fix: "Always include rel='noopener noreferrer' on target='_blank' links."
    sourcemap_exposed:
        why: "Sourcemaps (.js.map) allow anyone to download the full original source code, including comments and internal endpoints."
        fix: "Disable production sourcemaps in your build tool."
    hsts_short_max_age:
        why: "The HSTS max-age duration is below the recommended 6 months."
        fix: "Set max-age to at least 1 year (31536000 seconds)."
    cors_wildcard:
        why: "Access-Control-Allow-Origin: * combined with credentials allows unauthorized cross-origin data reads."
        fix: "Validate origins strictly and never return wildcard with credentials."
    referrer_policy_missing:
        why: "Sensitive URLs may leak in the Referer header to external services."
        fix: "Set Referrer-Policy: strict-origin-when-cross-origin."
    permissions_policy_missing:
        why: "Missing Permissions-Policy allows uncontrolled browser feature access."
        fix: "Set Permissions-Policy header to restrict camera, microphone, and geolocation."
    server_header_leak:
        why: "Disclosing exact web server versions helps attackers target known CVEs."
        fix: "Turn off server signature and tokens in Nginx or Apache."
    form_no_csrf:
        why: "POST form without a detected anti-CSRF token."
        fix: "Add a unique, per-session anti-CSRF token to all mutation forms."
    comment_leak:
        why: "Public HTML comments disclose developer notes, private IPs, or credentials."
        fix: "Strip comments during production builds."
    http_error:
        why: "The page returned an HTTP error (4xx or 5xx)."
        fix: "Verify URL routes and server availability."
    redirect:
        why: "The page redirected to another URL."
        fix: "Ensure redirect chains point to the final HTTPS destination."
    blocked:
        why: "URL is excluded by robots.txt."
        fix: "No action required if intentional."

