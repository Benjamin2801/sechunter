help:
    secret_token_exposed:
        why: "Des clés d'API (AWS, Stripe, Google, tokens d'accès) ont été détectées dans le code JavaScript ou HTML public. Un attaquant peut les extraire pour usurper vos services ou générer des coûts."
        fix: "Stockez vos clés d'API dans des variables d'environnement côté serveur (.env) et révoquez immédiatement les clés compromises depuis votre console fournisseur."
    insecure_form_action:
        why: "Ce formulaire transmet des informations (potentiellement des identifiants ou mots de passe) vers une URL en clair (http://), exposant les données à l'interception sur le réseau (Man-in-the-Middle)."
        fix: "Modifiez l'attribut action pour pointer exclusivement vers une URL en https://."
    mixed_content:
        why: "La page est sécurisée en HTTPS mais charge des ressources (scripts, styles, images) en HTTP non chiffré. Un attaquant sur le réseau peut intercepter ou modifier ces ressources pour exécuter du code malveillant."
        fix: "Mettez à jour les URLs des ressources pour utiliser le protocole https:// ou des chemins relatifs."
    csp_missing:
        why: "L'absence de Content-Security-Policy laisse le navigateur sans consigne sur les sources fiables pour charger des scripts ou styles, facilitant l'exploitation des attaques XSS (Cross-Site Scripting)."
        fix: "Ajoutez l'en-tête Content-Security-Policy dans votre configuration Nginx :\nadd_header Content-Security-Policy \"default-src 'self'; script-src 'self'; style-src 'self';\" always;\nOu dans Apache (.htaccess) :\nHeader set Content-Security-Policy \"default-src 'self'; script-src 'self'; style-src 'self';\""
    hsts_missing:
        why: "Sans Strict-Transport-Security, un visiteur peut être redirigé vers une version non chiffrée (HTTP) lors de sa première visite ou lors d'une attaque SSL Strip."
        fix: "Dans Nginx :\nadd_header Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\" always;\nDans Apache :\nHeader always set Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\""
    x_frame_missing:
        why: "Le site peut être intégré dans une iframe sur un site tiers malveillant pour tromper l'utilisateur et intercepter ses clics (Clickjacking)."
        fix: "Dans Nginx :\nadd_header X-Frame-Options \"SAMEORIGIN\" always;\nDans Apache :\nHeader set X-Frame-Options \"SAMEORIGIN\""
    cookie_no_secure:
        why: "Sans le flag Secure, le navigateur transmettra le cookie même lors d'une connexion HTTP non chiffrée, exposant le jeton de session à l'écoute réseau."
        fix: "En PHP :\nsession_set_cookie_params(['secure' => true, 'httponly' => true, 'samesite' => 'Lax']);"
    cookie_no_httponly:
        why: "Sans le flag HttpOnly, le cookie peut être lu par du code JavaScript (document.cookie). Si une faille XSS existe, l'attaquant peut dérober la session de l'utilisateur."
        fix: "Activez HttpOnly sur tous les cookies d'authentification et de session dans la configuration de votre framework ou en PHP : session.cookie_httponly = 1 dans php.ini."
    cookie_samesite_missing:
        why: "L'attribut SameSite contrôle si le cookie est envoyé avec les requêtes provenant de sites tiers. Sans cet attribut, le site est vulnérable aux requêtes frauduleuses (CSRF)."
        fix: "Configurez vos cookies avec SameSite=Lax (recommandé pour la navigation courante) ou SameSite=Strict."
    csp_unsafe_inline:
        why: "L'instruction 'unsafe-inline' autorise l'exécution de scripts directement injectés dans le HTML, neutralisant une grande partie de la protection contre les failles XSS."
        fix: "Migrez vos scripts inline vers des fichiers JS externes ou utilisez des nonces cryptographiques (nonce-XXXXX) générés à chaque requête."
    csp_unsafe_eval:
        why: "L'instruction 'unsafe-eval' permet l'exécution de code dynamique via eval() ou setTimeout(string), souvent détourné par les attaquants."
        fix: "Refactorisez le code JavaScript pour éliminer les appels à eval() ou Function()."
    csp_wildcard:
        why: "L'utilisation de jokers (*) dans script-src ou default-src autorise le chargement de scripts depuis n'importe quel domaine public sur Internet."
        fix: "Spécifiez explicitement les noms de domaine des tiers autorisés (ex: cdn.jsdelivr.net, apis.google.com)."
    nosniff_missing:
        why: "Sans l'en-tête X-Content-Type-Options: nosniff, certains navigateurs tentent de deviner le type de contenu (MIME sniffing) et peuvent exécuter un fichier texte ou une image contenant du JS."
        fix: "Dans Nginx :\nadd_header X-Content-Type-Options \"nosniff\" always;\nDans Apache :\nHeader set X-Content-Type-Options \"nosniff\""
    tabnabbing:
        why: "Un lien ouvrant un nouvel onglet (target=\"_blank\") sans rel=\"noopener noreferrer\" donne à la page de destination un accès partiel à la page d'origine via window.opener, permettant une redirection malveillante."
        fix: "Ajoutez systématiquement rel=\"noopener noreferrer\" sur toutes les balises <a> utilisant target=\"_blank\"."
    sourcemap_exposed:
        why: "Les fichiers source maps (.js.map) permettent à quiconque de reconstruire le code source original complet non minifié (composants, secrets internes, commentaires)."
        fix: "Désactivez la génération des sourcemaps en production dans votre bundler (Vite, Webpack, esbuild) ou bloquez leur accès public dans la configuration du serveur web."
    hsts_short_max_age:
        why: "La durée max-age du HSTS est inférieure aux 6 mois recommandés par les standards de sécurité (15 552 000 secondes)."
        fix: "Augmentez la durée max-age à au moins 1 an (31536000 secondes) :\nStrict-Transport-Security: max-age=31536000; includeSubDomains"
    cors_wildcard:
        why: "L'en-tête Access-Control-Allow-Origin configuré à * combiné avec les credentials (cookies) est une anomalie critique permettant à tout site tiers de lire des données privées."
        fix: "Validez rigoureusement l'origine de la requête et ne renvoyez jamais de wildcard avec Access-Control-Allow-Credentials: true."
    referrer_policy_missing:
        why: "Sans politique de Referrer explicite, des URLs privées contenant des jetons ou paramètres sensibles peuvent fuiter vers des domaines tiers dans l'en-tête Referer."
        fix: "Ajoutez l'en-tête Referrer-Policy: strict-origin-when-cross-origin."
    permissions_policy_missing:
        why: "L'absence de Permissions-Policy permet l'accès par défaut aux fonctionnalités matérielles sensibles (géolocalisation, microphone, caméra) sans restriction."
        fix: "Définissez un en-tête Permissions-Policy pour restreindre les APIs du navigateur :\nPermissions-Policy: geolocation=(), camera=(), microphone=()"
    server_header_leak:
        why: "L'en-tête Server ou X-Powered-By divulgue le nom et la version exacte de votre serveur ou langage, facilitant la recherche de vulnérabilités connues (CVEs) ciblées."
        fix: "Dans Nginx : server_tokens off;\nDans PHP : expose_php = Off dans php.ini\nDans Apache : ServerTokens Prod et ServerSignature Off."
    form_no_csrf:
        why: "Ce formulaire effectue une action en POST sans jeton de validation anti-CSRF apparent. Un attaquant peut forcer un utilisateur authentifié à soumettre ce formulaire à son insu."
        fix: "Intégrez un jeton anti-CSRF aléatoire et unique par session pour chaque formulaire de modification de données."
    comment_leak:
        why: "Des commentaires HTML publics contiennent des notes de développeurs (TODO, adresses IP privées ou termes relatifs à des identifiants)."
        fix: "Nettoyez les commentaires HTML avant la mise en production ou configurez votre moteur de template pour les retirer au rendu."
    http_error:
        why: "La page a retourné un code d'erreur HTTP (statut 4xx ou 5xx) ou n'a pas pu être contactée."
        fix: "Vérifiez la configuration du serveur et la validité de l'URL dans le maillage interne."
    redirect:
        why: "La page renvoie une redirection HTTP (301, 302, 307 ou 308)."
        fix: "Assurez-vous que la redirection pointe bien vers la version sécurisée HTTPS définitive."
    blocked:
        why: "L'URL est interdite d'exploration par les directives de votre fichier robots.txt."
        fix: "Aucune action requise si ce blocage est intentionnel."

